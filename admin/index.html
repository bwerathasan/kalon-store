<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILLAGE — لوحة الطلبات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: #f4f4f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #1a1a1a;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #C9A84C; }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-meta { font-size: 13px; color: #aaa; }

    /* ── Toolbar ── */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .toolbar-count {
      font-size: 14px;
      color: #666;
    }
    .toolbar-count strong { color: #1a1a1a; }
    .btn-refresh {
      margin-right: auto;
      padding: 8px 18px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #333; }
    .btn-refresh:disabled { background: #999; cursor: default; }

    /* ── Stock panel ── */
    .stock-panel {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .stock-panel-label {
      font-size: 11px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 8px;
    }
    .stock-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stock-name  { font-size: 13px; font-weight: 600; color: #1a1a1a; }
    .stock-count { font-size: 13px; color: #666; min-width: 60px; }
    .stock-count.oos { color: #c0392b; font-weight: 700; }
    .stock-count.low { color: #e67e22; font-weight: 700; }
    .waitlist-count { font-size: 11px; color: #999; }
    .stock-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stock-input {
      width: 70px;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    .btn-stock {
      padding: 6px 12px;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-stock.add    { background: #C9A84C; }
    .btn-stock.add:hover { background: #b8943f; }
    .btn-stock.reduce { background: #e67e22; }
    .btn-stock.reduce:hover { background: #ca6f1e; }
    .btn-stock.set    { background: #2980b9; }
    .btn-stock.set:hover { background: #2471a3; }
    .btn-stock.zero   { background: #c0392b; }
    .btn-stock.zero:hover { background: #a93226; }
    .btn-stock:disabled { background: #ccc; cursor: default; }

    /* ── Main ── */
    .main { padding: 28px 32px; max-width: 1100px; margin: 0 auto; }

    /* ── States ── */
    .state-box {
      text-align: center;
      padding: 64px 32px;
      color: #888;
      font-size: 16px;
    }
    .state-box .state-icon { font-size: 40px; margin-bottom: 16px; }
    .state-error { color: #c0392b; }

    /* ── Order card ── */
    .orders-list { display: flex; flex-direction: column; gap: 16px; }

    .order-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 32px;
    }
    .order-card:hover { border-color: #C9A84C; }

    .order-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 4px;
    }
    .order-name { font-size: 17px; font-weight: 700; }
    .order-time {
      font-size: 12px;
      color: #999;
      background: #f4f4f5;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .field { display: flex; flex-direction: column; gap: 3px; }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field-value { font-size: 15px; color: #1a1a1a; }
    .field-value.empty { color: #ccc; font-style: italic; font-size: 13px; }

    .field--full { grid-column: 1 / -1; }

    /* phone link */
    .field-value a { color: #1a1a1a; text-decoration: none; }
    .field-value a:hover { color: #C9A84C; }

    /* product badge */
    .product-badge { font-weight: 600; color: #C9A84C; }

    /* ── Print button ── */
    .order-footer {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      margin-top: 4px;
    }
    .btn-print {
      padding: 7px 20px;
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-print:hover { border-color: #1a1a1a; background: #f4f4f5; }

    @media (max-width: 640px) {
      .main { padding: 16px; }
      .toolbar { padding: 12px 16px; }
      .header { padding: 14px 16px; }
      .order-card { grid-template-columns: 1fr; }
      .order-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="header-logo">SILLAGE</span>
    <span class="header-title">لوحة الطلبات</span>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="header-meta" id="last-updated">—</span>
      <a href="/admin/logout" style="font-size:12px;color:#888;text-decoration:none;border:1px solid #444;padding:4px 12px;border-radius:4px;transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">Logout</a>
    </div>
  </header>

  <div class="toolbar">
    <span class="toolbar-count" id="order-count">جاري التحميل...</span>
    <button class="btn-refresh" id="btn-refresh" onclick="loadOrders()">↻ تحديث</button>
  </div>

  <div class="stock-panel" id="stock-panel">
    <span class="stock-panel-label">Stock</span>

    <div class="stock-item">
      <span class="stock-name">Citrus</span>
      <span class="stock-count" id="stock-citrus">—</span>
      <span class="waitlist-count" id="wl-citrus"></span>
      <div class="stock-controls">
        <input class="stock-input" id="input-citrus" type="number" min="1" max="9999" placeholder="Units" />
        <button class="btn-stock add"    onclick="stockAction('citrus','add')">+ Add</button>
        <button class="btn-stock reduce" onclick="stockAction('citrus','reduce')">− Reduce</button>
        <button class="btn-stock set"    onclick="stockAction('citrus','set')">Set</button>
        <button class="btn-stock zero"   onclick="stockSetZero('citrus')">Set 0</button>
      </div>
    </div>

    <div class="stock-item">
      <span class="stock-name">Rouge</span>
      <span class="stock-count" id="stock-rouge">—</span>
      <span class="waitlist-count" id="wl-rouge"></span>
      <div class="stock-controls">
        <input class="stock-input" id="input-rouge" type="number" min="1" max="9999" placeholder="Units" />
        <button class="btn-stock add"    onclick="stockAction('rouge','add')">+ Add</button>
        <button class="btn-stock reduce" onclick="stockAction('rouge','reduce')">− Reduce</button>
        <button class="btn-stock set"    onclick="stockAction('rouge','set')">Set</button>
        <button class="btn-stock zero"   onclick="stockSetZero('rouge')">Set 0</button>
      </div>
    </div>

    <div class="stock-item">
      <span class="stock-name">Sweet</span>
      <span class="stock-count" id="stock-sweet">—</span>
      <span class="waitlist-count" id="wl-sweet"></span>
      <div class="stock-controls">
        <input class="stock-input" id="input-sweet" type="number" min="1" max="9999" placeholder="Units" />
        <button class="btn-stock add"    onclick="stockAction('sweet','add')">+ Add</button>
        <button class="btn-stock reduce" onclick="stockAction('sweet','reduce')">− Reduce</button>
        <button class="btn-stock set"    onclick="stockAction('sweet','set')">Set</button>
        <button class="btn-stock zero"   onclick="stockSetZero('sweet')">Set 0</button>
      </div>
    </div>

  </div>

  <main class="main">
    <div id="content">
      <div class="state-box">
        <div class="state-icon">⏳</div>
        جاري تحميل الطلبات...
      </div>
    </div>
  </main>

  <script>
    const API = '/api/orders';

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    var SKU_LABELS = { citrus: 'Sillage Citrus', rouge: 'Sillage Rouge', sweet: 'Sillage Sweet' };
    var SKU_PRICES = { rouge: 149, citrus: 219, sweet: 235 };

    function formatProduct(p) {
      if (!p) return '<span style="color:#ccc;font-style:italic;font-size:13px;">—</span>';
      // product is a comma-separated selection like "citrus,rouge,sweet"
      var parts = p.split(',').map(function(s) { return s.trim(); });
      var counts = {};
      parts.forEach(function(s) { counts[s] = (counts[s] || 0) + 1; });
      var label = Object.keys(counts).map(function(sku) {
        var name = SKU_LABELS[sku] || sku;
        return name + (counts[sku] > 1 ? ' × ' + counts[sku] : '');
      }).join(' + ');
      var total = parts.reduce(function(sum, sku) { return sum + (SKU_PRICES[sku] || 0); }, 0);
      var price = '₪' + total;
      return escHtml(label) + ' &nbsp;<span style="color:#C9A84C;font-weight:700;">' + price + '</span>';
    }

    function val(v) {
      if (!v || v.toString().trim() === '') {
        return '<span class="field-value empty">—</span>';
      }
      return '<span class="field-value">' + escHtml(v) + '</span>';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    var _orders = [];

    function renderOrders(orders) {
      _orders = orders;
      const content = document.getElementById('content');
      const countEl = document.getElementById('order-count');

      if (!orders.length) {
        countEl.innerHTML = '<strong>0</strong> طلب';
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon">📭</div>
            لا توجد طلبات بعد
          </div>`;
        return;
      }

      countEl.innerHTML = '<strong>' + orders.length + '</strong> طلب';

      const cards = orders.map(function(o, i) {
        const phone = o.phone
          ? '<span class="field-value"><a href="tel:' + escHtml(o.phone) + '">' + escHtml(o.phone) + '</a></span>'
          : '<span class="field-value empty">—</span>';

        return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-name">${escHtml(o.full_name || '—')}</span>
              <span class="order-time">${formatDate(o.created_at)}</span>
            </div>

            <div class="field">
              <span class="field-label">رقم الهاتف</span>
              ${phone}
            </div>

            <div class="field">
              <span class="field-label">البريد الإلكتروني</span>
              ${val(o.email)}
            </div>

            <div class="field">
              <span class="field-label">المدينة</span>
              ${val(o.city)}
            </div>

            <div class="field">
              <span class="field-label">العنوان</span>
              ${val(o.address)}
            </div>

            <div class="field">
              <span class="field-label">المنتج</span>
              <span class="field-value product-badge" data-product="${escHtml(o.product || '')}">${formatProduct(o.product)}</span>
            </div>

            <div class="field field--full">
              <span class="field-label">الملاحظات</span>
              ${val(o.notes)}
            </div>

            <div class="order-footer">
              <button class="btn-print" onclick="printOrder(${i})">🖨 طباعة</button>
            </div>
          </div>`;
      }).join('');

      content.innerHTML = '<div class="orders-list">' + cards + '</div>';
    }

    function printOrder(i) {
      var o = _orders[i];
      var date = formatDate(o.created_at);
      var win = window.open('', '_blank', 'width=400,height=600');
      // Build selection lines for print
      var printSkuLabels = { citrus: 'Sillage Citrus', rouge: 'Sillage Rouge', sweet: 'Sillage Sweet' };
      var printSkuPrices = { citrus: 219, rouge: 149, sweet: 235 };
      var printParts = (o.product || '').split(',').map(function(s) { return s.trim(); }).filter(function(s) { return printSkuLabels[s]; });
      var printCounts = {};
      printParts.forEach(function(s) { printCounts[s] = (printCounts[s] || 0) + 1; });
      var printTotal = '₪' + printParts.reduce(function(sum, sku) { return sum + (printSkuPrices[sku] || 0); }, 0);
      var printRows = Object.keys(printCounts).map(function(sku) {
        var count = printCounts[sku];
        return '<tr><td>' + escHtml(printSkuLabels[sku] + (count > 1 ? ' × ' + count : '')) + '</td><td></td></tr>';
      }).join('') + '<tr class="total-row"><td>Total</td><td>' + printTotal + '</td></tr>';

      win.document.write(`<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>طلب — ${escHtml(o.full_name || '')}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', Arial, sans-serif; font-size: 13px; color: #000; background: #fff; padding: 16px; direction: rtl; }
    .logo { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 3px; margin-bottom: 12px; }
    .divider { border: none; border-top: 1px dashed #000; margin: 10px 0; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
    .row .label { color: #555; }
    .row .value { font-weight: 600; text-align: left; max-width: 60%; }
    .items-table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    .items-table td { padding: 4px 0; font-size: 13px; }
    .items-table td:last-child { text-align: left; font-weight: 600; }
    .total-row td { border-top: 1px dashed #000; padding-top: 8px; font-weight: 700; font-size: 14px; }
    .footer { text-align: center; font-size: 11px; color: #555; margin-top: 14px; }
    @media print { body { padding: 8px; } }
  </style>
</head>
<body>
  <div class="logo">SILLAGE</div>

  <hr class="divider"/>

  <div class="section-title">Customer Details</div>
  <div class="row"><span class="label">Name</span><span class="value">${escHtml(o.full_name || '—')}</span></div>
  <div class="row"><span class="label">Phone</span><span class="value">${escHtml(o.phone || '—')}</span></div>
  <div class="row"><span class="label">Email</span><span class="value">${escHtml(o.email || '—')}</span></div>
  <div class="row"><span class="label">City</span><span class="value">${escHtml(o.city || '—')}</span></div>
  <div class="row"><span class="label">Address</span><span class="value">${escHtml(o.address || '—')}</span></div>
  ${o.notes ? '<div class="row"><span class="label">Notes</span><span class="value">' + escHtml(o.notes) + '</span></div>' : ''}
  <div class="row"><span class="label">Order Time</span><span class="value">${escHtml(date)}</span></div>

  <hr class="divider"/>

  <div class="section-title">Order Details</div>
  <table class="items-table">${printRows}</table>

  <div class="row" style="margin-top:8px;">
    <span class="label">Payment</span>
    <span class="value">Cash on Delivery</span>
  </div>
  <div class="row">
    <span class="label">Shipping</span>
    <span class="value">Free</span>
  </div>

  <hr class="divider"/>
  <div class="footer">Thank you for your SILLAGE order ✦</div>

  <script>window.onload = function(){ window.print(); }<\/script>
</body>
</html>`);
      win.document.close();
    }

    function loadOrders() {
      const btn = document.getElementById('btn-refresh');
      const content = document.getElementById('content');
      btn.disabled = true;
      btn.textContent = '...جاري التحديث';

      fetch(API)
        .then(function(res) { return res.json(); })
        .then(function(body) {
          if (!body.success) throw new Error(body.error || 'فشل التحميل');
          renderOrders(body.orders || []);
          document.getElementById('last-updated').textContent =
            'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
        })
        .catch(function(err) {
          console.error('[ADMIN] Failed to load orders:', err);
          document.getElementById('content').innerHTML = `
            <div class="state-box state-error">
              <div class="state-icon">⚠️</div>
              فشل تحميل الطلبات — تأكد أن السيرفر يعمل على localhost:5000<br/>
              <small style="margin-top:8px;display:block;direction:ltr;">${escHtml(err.message)}</small>
            </div>`;
          document.getElementById('order-count').textContent = 'خطأ في التحميل';
        })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = '↻ تحديث';
        });
    }

    loadOrders();
    loadStock();

    function loadStock() {
      fetch('/api/inventory/stock')
        .then(function(r) { return r.json(); })
        .then(function(body) {
          if (!body.success) return;
          var s  = body.stock;
          var wl = body.waitlist;

          function setStock(elId, count) {
            var el = document.getElementById(elId);
            if (!el) return;
            el.textContent = count + ' units';
            el.className   = 'stock-count' + (count === 0 ? ' oos' : count <= 3 ? ' low' : '');
          }
          function setWL(elId, count) {
            var el = document.getElementById(elId);
            if (el) el.textContent = count > 0 ? count + ' waiting' : '';
          }

          setStock('stock-citrus', s['citrus'] || 0);
          setStock('stock-rouge',  s['rouge']  || 0);
          setStock('stock-sweet',  s['sweet']  || 0);
          setWL('wl-citrus', wl['citrus'] || 0);
          setWL('wl-rouge',  wl['rouge']  || 0);
          setWL('wl-sweet',  wl['sweet']  || 0);
        })
        .catch(function(err) { console.error('[STOCK] load failed:', err.message); });
    }

    var INPUT_IDS = { 'citrus': 'input-citrus', 'rouge': 'input-rouge', 'sweet': 'input-sweet' };
    var BTN_LABELS = { add: '+ Add', reduce: '− Reduce', set: 'Set' };

    function stockAction(product, action) {
      var inputEl = document.getElementById(INPUT_IDS[product]);
      var value   = parseInt(inputEl.value, 10);
      if (isNaN(value) || value < (action === 'set' ? 0 : 1)) {
        alert(action === 'set' ? 'Enter a number (0 or more).' : 'Enter a positive number.');
        return;
      }

      var endpoint, body;
      if (action === 'add') {
        endpoint = '/api/inventory/restock';
        body     = { product: product, quantity: value };
      } else if (action === 'reduce') {
        endpoint = '/api/inventory/reduce';
        body     = { product: product, amount: value };
      } else {
        endpoint = '/api/inventory/set';
        body     = { product: product, stock: value };
      }

      _sendStockRequest(endpoint, body, product, BTN_LABELS[action]);
      inputEl.value = '';
    }

    function stockSetZero(product) {
      if (!confirm('Set ' + product + ' stock to 0?')) return;
      _sendStockRequest('/api/inventory/set', { product: product, stock: 0 }, product, 'Set 0');
    }

    function _sendStockRequest(endpoint, body, product, label) {
      var btns = document.querySelectorAll('#stock-panel .btn-stock');
      btns.forEach(function(b) { b.disabled = true; });

      fetch(endpoint, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          loadStock();
        } else {
          alert('Failed: ' + res.error);
        }
      })
      .catch(function() { alert('Request failed.'); })
      .finally(function() {
        btns.forEach(function(b) { b.disabled = false; });
      });
    }
  </script>

</body>
</html>
